[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-notebook"
version = "0.2.0"
description = "A local, source-grounded study workspace built with Python and LlamaIndex"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "nicegui>=3.0,<4", "llama-index-core>=0.12,<0.15",
  "lancedb>=0.20,<0.30", "fastembed>=0.6,<0.9",
  "google-genai>=1.0,<3", "httpx>=0.28,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2",
  "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5",
  "fpdf2>=2.8,<3", "keyring>=25,<27", "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "psutil>=6", "playwright>=1.50", "matplotlib>=3.9,<4"]
ocr = ["rapidocr-onnxruntime>=1.4", "pypdfium2>=4"]
advanced = ["docling>=2", "sentence-transformers>=3"]

[project.scripts]
local-notebook = "local_notebook.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/scale.py" = ["E402"]
